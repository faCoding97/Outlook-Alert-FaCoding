name: Windows build and layout

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows app
        run: dotnet build App/OutlookAlert.csproj -c Release
      - name: Build per-user launcher
        run: dotnet build Launcher/OutlookAlert.Launcher.csproj -c Release
      - name: Build installer source
        # This is a compile check. A release installer additionally requires the
        # signed, pinned embedded payloads, which are not stored in source control.
        run: dotnet build Installer/OutlookAlert.Setup.csproj -c Release
      - name: Check notification identity and duplicate handling
        run: dotnet run --project Tests/NotificationGate.Tests.csproj -c Release
      - name: Check startup state and user choices
        run: dotnet run --project StartupTests/StartupTests.csproj -c Release
      - name: Check sound selection and burst handling
        run: dotnet run --project SoundTests/SoundTests.csproj -c Release
      - name: Build isolated installer layout check
        run: dotnet build Tests.Windows/LayoutSmoke.csproj -c Release
      - name: Check installer layout on Windows
        shell: pwsh
        run: |
          & .\Tests.Windows\bin\Release\net48\OutlookAlert.LayoutSmoke.exe artifacts/layout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render the alert preview
        shell: powershell
        run: |
          Add-Type -AssemblyName PresentationFramework, PresentationCore, WindowsBase
          $source = Get-Content App/PopupPresenter.cs -Raw
          $match = [regex]::Match($source, 'private const string AlertXaml = """\r?\n([\s\S]*?)\r?\n""";')
          if (-not $match.Success) { throw 'Alert markup was not found.' }
          $settingsSource = Get-Content App/Program.cs -Raw
          $templateMatch = [regex]::Match($settingsSource, 'private const string ActionButtonTemplate = """\r?\n([\s\S]*?)\r?\n""";')
          if (-not $templateMatch.Success) { throw 'Settings button markup was not found.' }
          $button = [Windows.Controls.Button]::new()
          $button.Content = 'Enable monitoring'
          $button.Template = [Windows.Markup.XamlReader]::Parse($templateMatch.Groups[1].Value)
          [void]$button.ApplyTemplate()
          $view = [Windows.Markup.XamlReader]::Parse($match.Groups[1].Value)
          try {
            $view.FindName('CountText').Text = '1 new email'
            $view.FindName('TimeText').Text = '14:30'
            $view.Show()
            $view.UpdateLayout()
            $bitmap = [Windows.Media.Imaging.RenderTargetBitmap]::new(960, 640, 96, 96, [Windows.Media.PixelFormats]::Pbgra32)
            $bitmap.Render($view)
            $encoder = [Windows.Media.Imaging.PngBitmapEncoder]::new()
            $encoder.Frames.Add([Windows.Media.Imaging.BitmapFrame]::Create($bitmap))
            New-Item -ItemType Directory -Force artifacts/layout | Out-Null
            $stream = [IO.File]::Create((Join-Path $pwd 'artifacts/layout/alert-preview.png'))
            try { $encoder.Save($stream) } finally { $stream.Dispose() }
          } finally { $view.Close() }
      - name: Save layout results and owned-form screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-layout-results
          path: artifacts/layout/
          if-no-files-found: warn
          retention-days: 14
